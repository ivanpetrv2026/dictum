name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  DOTNET_VERSION: "8.0.x"
  PROJECT: src/Dictum/Dictum.csproj
  # secrets are not allowed in `if:` expressions; expose them as env flags instead
  SIGNING_ENABLED: ${{ secrets.AZURE_TENANT_ID != '' }}
  VT_ENABLED: ${{ secrets.VIRUSTOTAL_API_KEY != '' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Publish (self-contained)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r win-x64
          --self-contained true
          -p:DebugType=embedded
          -o publish

      # Signing is optional so the workflow stays green on forks.
      # All six AZURE_* secrets are required to enable it; SIGNING_ENABLED checks only the tenant id.
      # azure/trusted-signing-action@v0 is the legacy action name for Azure Artifact Signing
      # (formerly Azure Trusted Signing). Public Trust is not available to individual
      # developers outside the US and Canada, so this step is not a realistic path here.
      - name: Sign executable (Azure Trusted Signing)
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: publish
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installers (full + lite)
        shell: pwsh
        run: |
          iscc installer/dictum.iss /DAppVersion=${{ github.ref_name }} /DSourceDir=${{ github.workspace }}\publish /DOutputDir=${{ github.workspace }}\artifacts /DEdition=full
          Copy-Item publish publish-lite -Recurse
          Remove-Item publish-lite\runtimes\cuda12 -Recurse -Force
          iscc installer/dictum.iss /DAppVersion=${{ github.ref_name }} /DSourceDir=${{ github.workspace }}\publish-lite /DOutputDir=${{ github.workspace }}\artifacts /DEdition=lite

      - name: Sign installer
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: artifacts
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Portable archive
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath "artifacts\Dictum_${{ github.ref_name }}_portable.zip" -CompressionLevel Optimal

      - name: Checksums
        shell: pwsh
        run: |
          # -Include без -Recurse и wildcard-пути возвращает пустой список,
          # из-за чего файл сумм молча не создавался (v0.4.0–v0.12.2).
          $hashes = Get-ChildItem artifacts -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name }
          if (@($hashes).Count -lt 2) { throw "Checksums: expected hashes for at least 2 artifacts, got $($hashes.Count)" }
          $hashes | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
          if (-not (Test-Path artifacts/SHA256SUMS.txt)) { throw "Checksums: SHA256SUMS.txt was not created" }
          Write-Host "--- SHA256SUMS.txt ---"
          Get-Content artifacts/SHA256SUMS.txt | Write-Host

      # Optional: needs a free VirusTotal API key in repository secrets.
      - name: VirusTotal pre-flight
        if: env.VT_ENABLED == 'true'
        shell: pwsh
        run: |
          $key = "${{ secrets.VIRUSTOTAL_API_KEY }}"
          $file = Get-ChildItem artifacts -Filter *.exe | Select-Object -First 1
          if (-not $file) { throw "No installer found" }

          $upload = Invoke-RestMethod -Method Post `
            -Uri "https://www.virustotal.com/api/v3/files" `
            -Headers @{ "x-apikey" = $key } `
            -Form @{ file = Get-Item $file.FullName }

          $id = $upload.data.id
          Write-Host "Analysis id: $id"

          for ($i = 0; $i -lt 12; $i++) {
            Start-Sleep -Seconds 30
            $report = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$id" -Headers @{ "x-apikey" = $key }
            if ($report.data.attributes.status -eq "completed") { break }
          }

          $s = $report.data.attributes.stats
          $detections = $s.malicious + $s.suspicious
          Write-Host "Detections: $detections (malicious $($s.malicious), suspicious $($s.suspicious), undetected $($s.undetected))"

          if ($detections -gt 3) {
            throw "VirusTotal reported $detections detections — release stopped."
          }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: artifacts/*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
